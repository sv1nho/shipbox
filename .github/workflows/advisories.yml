name: Advisories

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  fix:
    name: Fix what npm reports, then prove it still works
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ship_box
          POSTGRES_PASSWORD: ship_box
          POSTGRES_DB: ship_box
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ship_box:ship_box@127.0.0.1:5432/ship_box
      WEB_ORIGIN: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Look for a smaller way out of every advisory
        run: npm run advisories

      - name: See whether anything moved
        id: moved
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'anything=no' >> "$GITHUB_OUTPUT"
          else
            echo 'anything=yes' >> "$GITHUB_OUTPUT"
          fi

      - name: Install what the new lockfile asks for
        if: steps.moved.outputs.anything == 'yes'
        run: npm ci

      - name: Prove the new tree still works
        id: verify
        if: steps.moved.outputs.anything == 'yes'
        continue-on-error: true
        run: |
          npm run lint
          npm run typecheck
          npm run knip
          npm run build
          npm run size
          npm test
          npm audit --omit=dev --omit=optional --audit-level=high

      - name: Say in the report whether it held up
        if: steps.moved.outputs.anything == 'yes'
        run: |
          {
            echo ''
            echo '## Checks run on this branch'
            echo ''
            if [ '${{ steps.verify.outcome }}' = 'success' ]; then
              echo 'Lint, types, dead code, build, first load budget, tests and the production audit all passed here.'
            else
              echo 'Something in lint, types, dead code, build, first load budget, tests or the production audit'
              echo 'failed on this branch. Read the job log before merging — the bump is not safe yet.'
            fi
            echo ''
            echo 'The CI check on this pull request shows a red cross that no job ever filled in. That is'
            echo 'expected: GitHub refuses to start a run for a pull request its own Actions token opened,'
            echo 'so the checks above, run before this branch was pushed, are the ones that count. Only the'
            echo 'browser journeys and the secret scan are missing, and merging runs them on main.'
          } >> advisories.md

      - name: Open or update the one pull request
        if: steps.moved.outputs.anything == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B advisories
          git add package.json package-lock.json
          git commit -m 'fix: take the smallest dependency bump that closes the open advisories'
          git push --force origin advisories

          if [ -z "$(gh pr list --head advisories --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head advisories \
              --title 'fix: close the open npm advisories' --body-file advisories.md
          else
            gh pr edit advisories --title 'fix: close the open npm advisories' --body-file advisories.md
          fi

      - name: Put the report in the run summary
        if: always()
        run: |
          if [ -f advisories.md ]; then cat advisories.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fail if the bump did not hold up
        if: steps.verify.outcome == 'failure'
        run: exit 1
