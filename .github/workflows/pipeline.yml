name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-code:
    name: Quality code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead code and unused dependencies
        run: npm run knip

  build:
    name: Build
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: First load budget
        run: npm run size

  unit-test:
    name: Unit test
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ship_box
          POSTGRES_PASSWORD: ship_box
          POSTGRES_DB: ship_box
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ship_box:ship_box@127.0.0.1:5432/ship_box
      WEB_ORIGIN: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test, with the coverage thresholds
        run: npm test

  e2e:
    name: E2E
    needs: [build, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ship_box
          POSTGRES_PASSWORD: ship_box
          POSTGRES_DB: ship_box
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ship_box:ship_box@127.0.0.1:5432/ship_box
      WEB_ORIGIN: http://127.0.0.1:3100
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run e2e

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: e2e/.results
          retention-days: 7

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Audit what production ships
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Audit the tooling, without blocking on it
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
