name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: sv1nho/ci/.github/workflows/pipeline.yml@v1
    secrets: inherit
    with:
      boot_env: |
        RESEND_API_KEY=ci-only-not-a-real-key
        OTP_FROM=CI <ci-only@app.example>
