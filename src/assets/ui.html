<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Label Generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="p-4">
    <h2 class="mb-4">Enter Information</h2>

    <form id="labelForm">
      <h4>Sender</h4>

      <div id="senderPersonFields">
        <input
          class="form-control mb-2"
          placeholder="First name"
          id="sender_firstname"
          name="sender_firstname"
          required
        />
        <input
          class="form-control mb-2"
          placeholder="Last name"
          id="sender_lastname"
          name="sender_lastname"
          required
        />
        <button
          type="button"
          id="senderRandomNameBtn"
          class="btn btn-sm btn-info mb-2"
        >
          Generate random name
        </button>
      </div>

      <div id="senderCompanyFields" style="display: none">
        <input
          class="form-control mb-2"
          placeholder="Company name"
          id="sender_company"
          name="sender_company"
        />
      </div>

      <label class="mb-2 d-block">
        <input type="checkbox" id="sender_isCompany" />
        Company?
      </label>

      <input
        class="form-control mb-2"
        placeholder="Address"
        id="sender_address"
        name="sender_address"
        required
      />
      <input
        class="form-control mb-2"
        placeholder="Postal code"
        id="sender_postal"
        name="sender_postal"
        required
      />
      <input
        class="form-control mb-2"
        placeholder="City"
        id="sender_city"
        name="sender_city"
        required
      />
      <select
        class="form-select mb-3"
        id="sender_country"
        name="sender_country"
        required
      >
        <option value="BE" selected>Belgium</option>
        <option value="NL">The Netherlands</option>
        <option value="DE">Germany</option>
      </select>

      <h4 class="mt-4">Recipient</h4>

      <div id="recipientPersonFields">
        <input
          class="form-control mb-2"
          placeholder="First name"
          id="recipient_firstname"
          name="recipient_firstname"
          required
        />
        <input
          class="form-control mb-2"
          placeholder="Last name"
          id="recipient_lastname"
          name="recipient_lastname"
          required
        />
      </div>

      <div id="recipientCompanyFields" style="display: none">
        <input
          class="form-control mb-2"
          placeholder="Company name"
          id="recipient_company"
          name="recipient_company"
        />
      </div>

      <label class="mb-2 d-block">
        <input type="checkbox" id="recipient_isCompany" />
        Company?
      </label>
      <input
        class="form-control mb-2"
        placeholder="Address"
        id="recipient_address"
        name="recipient_address"
        required
      />
      <input
        class="form-control mb-2"
        placeholder="Postal code"
        id="recipient_postal"
        name="recipient_postal"
        required
      />
      <input
        class="form-control mb-2"
        placeholder="City"
        id="recipient_city"
        name="recipient_city"
        required
      />
      <select
        class="form-select mb-3"
        id="recipient_country"
        name="recipient_country"
        required
      >
        <option value="BE" selected>Belgium</option>
        <option value="NL">The Netherlands</option>
        <option value="DE">Germany</option>
      </select>

      <h4 class="mt-4">Label Language</h4>
      <select
        class="form-select mb-3"
        id="label_language"
        name="label_language"
        required
      >
        <option value="fr" selected>French</option>
        <option value="nl">Dutch</option>
        <option value="en">English</option>
      </select>

      <h4 class="mt-4">Carrier</h4>
      <select class="form-select mb-3" id="carrier" name="carrier" required>
        <option value="bpost" selected>Bpost</option>
        <option value="postnl">PostNL</option>
      </select>

      <h4 class="mt-4">Tracking Number</h4>
      <input
        class="form-control mb-3"
        placeholder="24 digits for Bpost"
        id="tracking_number"
        name="tracking_number"
        required
      />

      <button type="submit" class="btn btn-success">Generate Label</button>
    </form>

    <div id="output" class="mt-4"></div>
    <button
      id="downloadPdfBtn"
      class="btn btn-primary mt-3"
      style="display: none"
    >
      Download as PDF
    </button>

    <script type="module" src="../renderer.js"></script>
  </body>
</html>
